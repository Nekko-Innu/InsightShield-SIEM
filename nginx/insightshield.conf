# /etc/nginx/sites-available/insightshield
# Insight Shield reverse proxy — terminates TLS, forwards to gunicorn on 127.0.0.1:5000

limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/s;

# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 192.168.100.30 insightshield.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 192.168.100.30 insightshield.local;

    ssl_certificate     /etc/nginx/ssl/insightshield.crt;
    ssl_certificate_key /etc/nginx/ssl/insightshield.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "no-referrer" always;
    add_header Permissions-Policy       "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    # Tailwind and Prism are served from static/vendor/ now, so both CDN hosts
    # are gone from script-src and style-src. 'unsafe-inline' stays: the
    # tailwind.config block in _base.html and a handful of onclick/onsubmit
    # attributes still need it, and a nonce cannot come from add_header — it
    # would have to be minted per request inside Flask.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'" always;

    client_max_body_size 1m;
    access_log /var/log/nginx/insightshield.access.log;
    error_log  /var/log/nginx/insightshield.error.log warn;

    # Static assets served directly by nginx
    location /static/ {
        alias /opt/insightshield/insightshield/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Rate-limited webhook endpoint
    location = /wazuh-webhook {
        limit_req zone=webhook burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Health endpoint (no rate limit, for systemd/monitoring)
    location = /health {
        proxy_pass http://127.0.0.1:5000;
        access_log off;
    }

    # Round 4 — SSE stream needs disabled buffering and a long read timeout
    # so events flush immediately and the connection survives idle periods
    # between heartbeats. The catch-all "location /" below has 60s read
    # timeout which would close SSE connections; this dedicated block
    # overrides with 1-hour timeout and disables buffering / caching.
    location = /api/events/stream {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Everything else
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
