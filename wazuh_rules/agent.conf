<!--
  wazuh_rules/agent.conf — centralized agent config for the Windows agents
  (POS terminals and the manager PC). scripts/install.sh copies it to
  /var/ossec/etc/shared/default/agent.conf and the manager pushes it out.

  The two full_command blocks below only run if each agent opts in: Wazuh
  refuses manager-pushed commands by default. On every agent, add

      logcollector.remote_commands=1

  to C:\Program Files (x86)\ossec-agent\local_internal_options.conf, then
  restart the agent. No IP or interface is hardcoded — the gateway is read
  at runtime, so the same file serves every store.
-->
<agent_config os="Windows">

  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <syscheck>
    <directories realtime="yes">C:\POS</directories>
    <directories realtime="yes">C:\POS\shared</directories>
  </syscheck>

  <!-- Rule 100023 matches "ossec: output: 'arp-gateway" with check_diff, so it
       fires when the gateway's MAC changes. If NextHop comes back as a
       Tailscale/VPN hop, add -InterfaceAlias 'Ethernet*' to Get-NetRoute. -->
  <localfile>
    <log_format>full_command</log_format>
    <command>powershell -NoProfile -Command "$gw=(Get-NetRoute -DestinationPrefix '0.0.0.0/0' | Sort-Object RouteMetric | Select-Object -First 1).NextHop; arp -a $gw"</command>
    <alias>arp-gateway</alias>
    <frequency>30</frequency>
  </localfile>

  <!-- Rule 100031. Each probe sits in try/catch so a failed counter prints 0,
       never error text — check_diff would read that text as a change. Two
       signals, because Windows SYN-flood protection can keep the half-open
       count low while segments/sec still spikes. The thresholds are starting
       points: tune each to about half the value seen during a 10 s test flood.
       Assumes English perf-counter names. -->
  <localfile>
    <log_format>full_command</log_format>
    <command>powershell -NoProfile -Command "$s = try { @(Get-NetTCPConnection -State SynReceived -EA Stop).Count } catch { 0 }; $r = try { (Get-Counter '\TCPv4\Segments Received/sec' -EA Stop).CounterSamples[0].CookedValue } catch { 0 }; if ($s -gt 100 -or $r -gt 2000) { 'SYN_FLOOD_SUSPECTED' } else { 'ok' }"</command>
    <alias>syn-watch</alias>
    <frequency>10</frequency>
  </localfile>

</agent_config>
